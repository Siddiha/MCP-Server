[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leave-manager-mcp"
version = "0.2.0"
description = "An MCP server for employee leave: balances, booking, cancelling and history"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]<2",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
leave-manager = "leave_manager.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leave_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
